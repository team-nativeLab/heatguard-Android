# 붙여넣을 위치: <레포>/.github/workflows/ci-build-test.yml
# 목적: PR마다 컴파일 → 단위 테스트 → lint 를 실행한다. (ktlint/detekt 는 4개 레포 모두 미도입이라 넣지 않음)
# 주의: 워크플로 이름("CI Build & Test")은 ci-autofix-*.yml 의 workflow_run 트리거와 연결되어 있으므로 바꾸지 않는다.
name: CI Build & Test

on:
  pull_request:
    branches: [dev, main]

# 같은 PR 에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ci-build-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 최소 권한: 코드 읽기만 허용한다.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      # gradle-daemon-jvm.properties 가 JDK 21 을 요구한다. 명시 설치로 foojay 다운로드 지연/실패를 피한다.
      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # compileSdk 37 플랫폼이 러너에 없을 수 있어 명시 설치한다.
      - name: Android SDK 설치
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v4

      # google-services 플러그인을 쓰는 레포(BookOn)만 동작하는 단계. 나머지 레포에서는 건너뛴다.
      # Secret 이 있으면 실제 파일로 복원하고, 없으면(fork PR 등) 패키지명만 맞춘 더미 JSON 을 만든다.
      - name: google-services.json 준비 (해당 레포만)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if grep -Eq 'google\.services|google-services' app/build.gradle.kts && [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            else
              APP_PACKAGE=$(grep -oE 'applicationId *= *"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
              cat > app/google-services.json <<EOF
          {"project_info":{"project_number":"000000000000","project_id":"ci-dummy","storage_bucket":"ci-dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"${APP_PACKAGE}"}},"api_key":[{"current_key":"dummy-api-key"}]}],"configuration_version":"1"}
          EOF
            fi
          fi

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: Kotlin 컴파일 (debug)
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: 단위 테스트 (debug)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint (debug)
        run: ./gradlew :app:lintDebug --stacktrace

      # 실패해도 원인 확인을 위해 리포트를 항상 올린다.
      - name: 테스트·lint 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
