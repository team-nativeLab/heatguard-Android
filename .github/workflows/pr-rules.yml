# 붙여넣을 위치: <레포>/.github/workflows/pr-rules.yml  (4개 레포 동일 파일)
# 기준: agent-config-bundle-v2 의 AGENTS.md §6 과 github-conventions 스킬(통합 GitHub 표준)
#   - 브랜치  : <type>/#<issue>-<kebab>        (type: feature | fix | refactor | chore)
#   - 릴리스  : main 대상 PR 은 chore/#<issue>-release-<version> 브랜치에서만
#   - PR 제목 : <type>: <전체 작업 요약>          (type: feat | fix | refactor | test | docs | chore | style)
#   - PR 본문 : "변경 사항" / "검증" / "관련 이슈" 섹션 + Closes|Related to|Refs #<issue>, 브랜치의 이슈 번호와 일치
#   - 커밋    : <type>: [#<issue>] <작업 요약>, 커밋 메시지에 Closes/Fixes/Resolves 금지 (dev 대상 PR 만 검사)
# 대상: dev / main 을 base 로 하는 PR. (autofix/ 브랜치의 PR 은 작업 브랜치를 base 로 해서 검사 대상이 아니다)
# Draft 여부는 GitHub API 로 강제할 수 없어 검사하지 않는다. (기본 Draft 는 작성자 규칙)
name: PR Rules

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 읽기 전용. PR 제목·본문·브랜치명은 외부 입력이므로 셸에 넣지 않고 github-script 의 객체로만 다룬다.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 커밋 규칙 위반을 error(실패) 로 볼지 warning(경고만) 으로 볼지. 기존 브랜치 정리 중이면 warning 으로 낮춘다.
      COMMIT_RULE_LEVEL: error
    steps:
      - name: 브랜치·제목·본문·커밋 규칙 검사
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const baseBranch = pullRequest.base.ref;
            const headBranch = pullRequest.head.ref;
            const prTitle = pullRequest.title || "";
            const prBody = pullRequest.body || "";
            const commitLevel = process.env.COMMIT_RULE_LEVEL === "warning" ? "warning" : "error";

            const errorList = [];
            const warningList = [];

            // 1) 브랜치 이름과 base 조합 검사. 브랜치의 이슈 번호를 뽑아 본문·커밋과 대조한다.
            let branchIssueNumber = null;
            if (baseBranch === "main") {
              const releaseMatch = headBranch.match(/^chore\/#(\d+)-release-\S+$/);
              if (releaseMatch) {
                branchIssueNumber = releaseMatch[1];
              } else {
                errorList.push(`main 대상 PR 의 브랜치는 chore/#<이슈번호>-release-<버전> 형식이어야 합니다. (현재: ${headBranch})`);
              }
            } else {
              const workMatch = headBranch.match(/^(feature|fix|refactor|chore)\/#(\d+)-\S+$/);
              if (workMatch) {
                branchIssueNumber = workMatch[2];
              } else {
                errorList.push(`브랜치는 <feature|fix|refactor|chore>/#<이슈번호>-<요약> 형식이어야 합니다. (현재: ${headBranch})`);
              }
            }
            if (/^(claude|codex)\//.test(headBranch)) {
              errorList.push("브랜치에 claude/ 또는 codex/ 접두사를 사용할 수 없습니다.");
            }

            // 2) PR 제목: <type>: <전체 작업 요약>
            const titlePattern = /^(feat|fix|refactor|test|docs|chore|style): \S.*$/;
            if (!titlePattern.test(prTitle)) {
              errorList.push(`PR 제목은 "<type>: <전체 작업 요약>" 형식이어야 합니다. type: feat, fix, refactor, test, docs, chore, style (현재: ${prTitle})`);
            }

            // 3) PR 본문: 필수 섹션과 이슈 연결 문구
            for (const sectionName of ["변경 사항", "검증", "관련 이슈"]) {
              if (!new RegExp(`^##\\s*${sectionName}\\s*$`, "m").test(prBody)) {
                errorList.push(`PR 본문에 "## ${sectionName}" 섹션이 없습니다.`);
              }
            }
            const linkedIssueSet = new Set();
            const linkPattern = /^\s*(Closes|Related to|Refs)\s+#(\d+)\s*$/gim;
            let linkMatch;
            while ((linkMatch = linkPattern.exec(prBody)) !== null) {
              linkedIssueSet.add(linkMatch[2]);
            }
            if (linkedIssueSet.size === 0) {
              errorList.push('PR 본문 "관련 이슈"에 "Closes #<번호>"(전체 완료) 또는 "Related to #<번호>" / "Refs #<번호>"(일부 완료)를 한 줄로 작성해야 합니다.');
            } else if (branchIssueNumber && !linkedIssueSet.has(branchIssueNumber)) {
              errorList.push(`브랜치의 이슈 번호 #${branchIssueNumber} 가 PR 본문의 이슈 연결에 없습니다. (본문: ${[...linkedIssueSet].map((n) => "#" + n).join(", ")})`);
            }

            // 4) 커밋: dev 대상 PR 만 검사한다. main 대상 릴리스 PR 은 dev 의 커밋 이력 전체가 포함되므로 제외한다.
            if (baseBranch !== "main") {
              const commitList = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });
              const commitPattern = /^(feat|fix|refactor|test|docs|chore|style): \[#\d+\] \S.*$/;
              const closePattern = /\b(close[sd]?|fix(es|ed)?|resolve[sd]?)\s+#\d+/i;
              for (const commitItem of commitList) {
                // 병합 커밋(부모 2개 이상)은 규칙 대상이 아니다.
                if (commitItem.parents.length > 1) {
                  continue;
                }
                const commitMessage = commitItem.commit.message;
                const commitSubject = commitMessage.split("\n")[0];
                const shortSha = commitItem.sha.substring(0, 7);
                const targetList = commitLevel === "error" ? errorList : warningList;
                if (!commitPattern.test(commitSubject)) {
                  targetList.push(`커밋 ${shortSha} 제목이 "<type>: [#<이슈번호>] <작업 요약>" 형식이 아닙니다. (현재: ${commitSubject})`);
                }
                if (closePattern.test(commitMessage)) {
                  targetList.push(`커밋 ${shortSha} 에 Closes/Fixes/Resolves 를 쓸 수 없습니다. 이슈 종료 연결은 PR 본문에서만 합니다.`);
                }
              }
            }

            // 결과 출력: 경고는 주석으로, 오류가 하나라도 있으면 작업을 실패시킨다.
            for (const warningText of warningList) {
              core.warning(warningText);
            }
            for (const errorText of errorList) {
              core.error(errorText);
            }
            if (errorList.length > 0) {
              core.setFailed(`PR 규칙 위반 ${errorList.length}건. 위 오류를 수정한 뒤 다시 확인됩니다.`);
            }
